name: Release - Multiplatform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release Tag Name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: jetort
            asset_name: jetort-x86_64-unknown-linux-gnu.tar.gz
            use_cross: false

          # Linux aarch64 (ARM64 / Jetson / Raspberry Pi 5)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: jetort
            asset_name: jetort-aarch64-unknown-linux-gnu.tar.gz
            use_cross: true

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: jetort
            asset_name: jetort-aarch64-apple-darwin.tar.gz
            use_cross: false

          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: jetort
            asset_name: jetort-x86_64-apple-darwin.tar.gz
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: jetort.exe
            asset_name: jetort-x86_64-pc-windows-msvc.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if cross-compiling)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package_staging
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} package_staging/
          cp -f target/${{ matrix.target }}/release/*onnxruntime* package_staging/ 2>/dev/null || true
          cp config.yaml README.md package_staging/
          mkdir -p package_staging/scripts
          cp scripts/setup_onnxruntime.sh package_staging/scripts/
          chmod +x package_staging/${{ matrix.artifact_name }} package_staging/scripts/setup_onnxruntime.sh
          tar -czvf ${{ matrix.asset_name }} -C package_staging .
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
        shell: bash

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir package_staging
          copy target\${{ matrix.target }}\release\${{ matrix.artifact_name }} package_staging\
          copy /y target\${{ matrix.target }}\release\*onnxruntime* package_staging\ 2>nul || true
          copy config.yaml package_staging\
          copy README.md package_staging\
          7z a ${{ matrix.asset_name }} .\package_staging\*
          CertUtil -hashfile ${{ matrix.asset_name }} SHA256 > ${{ matrix.asset_name }}.sha256
        shell: bash

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  create-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          name: "Release ${{ steps.release_tag.outputs.TAG_NAME }}"
          body: |
            ## Universal One-Shot Tensor Inference Engine
            Automated multiplatform release for **${{ steps.release_tag.outputs.TAG_NAME }}**.
            
            ### Included Binaries:
            - **Linux x86_64**: `jetort-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux ARM64 / Jetson**: `jetort-aarch64-unknown-linux-gnu.tar.gz`
            - **macOS Apple Silicon (M1/M2/M3/M4)**: `jetort-aarch64-apple-darwin.tar.gz`
            - **macOS Intel**: `jetort-x86_64-apple-darwin.tar.gz`
            - **Windows x64**: `jetort-x86_64-pc-windows-msvc.zip`
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
