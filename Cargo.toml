[package]
name = "jetort"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight, zero-overhead one-shot tensor inference engine & server, powered by Rust."
authors = ["JetOrt Contributors"]
license = "MIT"

[package.metadata.hardware]
cuda_arch = 87

[features]
# CPU-only unless a target script selects providers. GPU arch is JETORT_CUDA_ARCH
# / TARGET_CUDA_ARCH (see scripts/build.sh), not an empty Cargo feature.
default = []
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]

[dependencies]
# Web framework and async runtime
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# ONNX Runtime (using load-dynamic to enable zero-compile-time-link on Jetson/ARM)
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "half"] }
half = { version = "2.4", default-features = false }
parking_lot = "0.12"

# Tokenizer for single-pass text models
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }

# Serialization and Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Observability and CLI
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
rayon = "1.12"

[dev-dependencies]
http-body-util = "0.1"
