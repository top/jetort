[package]
name = "jetort"
version = "0.1.0"
edition = "2021"
description = "Ultra-lightweight, zero-overhead one-shot tensor inference engine & server, powered by Rust."
authors = ["JetOrt Contributors"]
license = "MIT"

[package.metadata.hardware]
cuda_arch = 87

[features]
default = ["cuda", "tensorrt", "sm_87"]
cuda = ["ort/cuda"]
tensorrt = ["ort/tensorrt"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]

# GPU Compute Architecture profiles
sm_87 = []
sm_86 = []
sm_89 = []
sm_80 = []
sm_90 = []
sm_75 = []

[dependencies]
# Web framework and async runtime
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
tower = { version = "0.5" }
tower-http = { version = "0.5", features = ["trace", "cors"] }

# ONNX Runtime (using load-dynamic to enable zero-compile-time-link on Jetson/ARM)
ort = { version = "2.0.0-rc.13", features = ["load-dynamic", "half"] }
half = { version = "2.4", default-features = false }
parking_lot = "0.12"

# Dynamic Library Loading & FFI
libloading = "0.8"

# High-level tokenizer & chat template support
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
minijinja = { version = "2", features = ["loader", "json"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

# Serialization and Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Observability and CLI
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
base64 = "0.22"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
http-body-util = "0.1"
